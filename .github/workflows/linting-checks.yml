# This is the workflow for linting checks

name: linting checks

on:
    workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
    linting-check:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: Setup Java 17
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '17'
                cache: maven
                cache-dependency-path: server/pom.xml

            - name: Run Checkstyle & Spotless check (Maven)
              working-directory: server
              run: ./mvnw validate spotless:check -Dcheckstyle.skip=true -Dspotless.check.skip=true
