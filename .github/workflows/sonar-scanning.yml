# This workflow is for sonar scanning

name: sonar scanning

on:
  workflow_call:

jobs:
  sonar-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: server/pom.xml

      - name: Run SonarQube analysis
        working-directory: server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: com.server:server
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: ./mvnw test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dcheckstyle.skip=true -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.organization=$SONAR_ORGANIZATION