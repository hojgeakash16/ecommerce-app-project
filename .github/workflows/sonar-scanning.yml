# This workflow is for sonar scanning

name: sonar scanning

on:
    workflow_dispatch:

jobs:
    sonar-scanning:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: Run SonarQube analysis
              working-directory: server
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
                SONAR_PROJECT_KEY: com.server:server
              run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.projectKey=$SONAR_PROJECT_KEY