# This workflow will showcase all the procedures/flows for CI/CD pipeline

name: Devsecops Pipeline

on:
    workflow_dispatch:

permissions:
    contents: read
    issues: write
    security-events: write

jobs:
    # Secrets Scanning
    secret-scanning:
        secrets: inherit
        uses: ./.github/workflows/secrets-scanning.yml

    # Linting and Testing
    lint-test:
        needs: secret-scanning
        uses: ./.github/workflows/linting-checks.yml

    # SAST
    sast:
        needs: lint-test
        secrets: inherit
        uses: ./.github/workflows/sonar-scanning.yml

    # Dependencing Scanning
    dependency-scanning:
        needs: sast
        uses: ./.github/workflows/dependency-scanning.yml

    # Docker Image Build and Scan
    build-and-scan:
        needs: dependency-scanning
        secrets: inherit
        uses: ./.github/workflows/docker-image-scanning.yml

    # Push the image to DockerHub
    push-image:
        needs: build-and-scan
        secrets: inherit
        uses: ./.github/workflows/push-docker-image.yml

    # Deploying the image
    deploy-image:
        needs: push-image
        secrets: inherit
        uses: ./.github/workflows/deploy.yml

    # OWASP test post deployment
    OWASP-test:
        needs: deploy-image
        secrets: inherit
        uses: ./.github/workflows/owasp-test.yml



