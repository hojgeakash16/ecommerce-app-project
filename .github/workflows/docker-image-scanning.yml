# The workflow is for docker image build and scanning

name: Trivy scanning

on:
    workflow_call:

jobs:
    trivy-image-scan:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: Setting up Docker
              uses: docker/setup-docker-action@v5

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Client Image
              uses: docker/build-push-action@v7
              with:
                context: ./client
                load: true
                push: false
                tags: ${{ vars.DOCKERHUB_USERNAME }}/ecommerce-app-client:latest

            - name: Build Server Image
              uses: docker/build-push-action@v7
              with:
                context: ./server
                load: true
                push: false
                tags: ${{ vars.DOCKERHUB_USERNAME }}/ecommerce-app-server:latest

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: '${{ vars.DOCKERHUB_USERNAME }}/ecommerce-app-client:latest'
                format: 'table'
                exit-code: '0'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: '${{ vars.DOCKERHUB_USERNAME }}/ecommerce-app-server:latest'
                format: 'table'
                exit-code: '0'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'

            