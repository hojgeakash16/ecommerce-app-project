# This is the workflow for CI with ecommerce app

name: ecommerce-app-ci

on:
    workflow_dispatch:
        inputs:
            environments:
                description: select the environment wanted
                required: true
                type: choice
                options:
                    - dev
                    - uat
                    - prod

permissions:
    contents: read
    id-token: write
    pages: write

jobs:
   code:
    name: Build Client & Server (Node 24)
    runs-on: ubuntu-latest
    steps:
        - name: code checkout
          uses: actions/checkout@v7
          
        - name: setup node.js
          uses: actions/setup-node@v7
          with:
            node-version: 24
            cache: 'npm'
            cache-dependency-path: client/package-lock.json

        - name: Install client Dependencies
          run: npm ci --prefix client

        - name: Build client
          run: npm run build --prefix client

        - name: Set up JDK
          uses: actions/setup-java@v4
          with:
            java-version: '17' # Match the <java.version> in your server/pom.xml (e.g., 17 or 21)
            distribution: 'temurin'
            cache: 'maven'

        - name: Build server package
          working-directory: ./server
          run: ./mvnw package -DskipTests


   build:
    name: Build the Service 
    needs: code
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Upload Workspace Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: streamflix-workspace
            path: .
            include-hidden-files: true

   test:
       name: Test the Docker Applicaton
       needs: build
       runs-on: ubuntu-latest
       steps:
        - name: Download Build Workspace
          uses: actions/download-artifact@v4
          with:
            name: streamflix-workspace
            path: .

        - name: Start Production Containers
          run: docker compose -f docker-compose.yml up --build -d
            
        - name: Test client
          run: |
            for i in {1..15}; do
              if curl -fsS http://localhost:80/; then
                echo "Client is healthy"
                exit 0
            fi
            echo "Waiting for cient..."
            sleep 5
            done
            echo "Client health check failed"
            exit 1

        - name: Test server and Database
          run: |
            for i in {1..15}; do
              if curl -fsS http://localhost:8080/actuator/health; then
              echo "server and database are healthy"
              exit 0
            fi
            echo "Waiting for server..."
            sleep 5
            done
            echo "server health check failed"
            docker compose -f docker-compose-prod.yml ps
            docker compose -f docker-compose-prod.yml logs
            exit 1

        - name: Stop Containers
          if: always()
          run: docker compose -f docker-compose.yml down -v --rmi local
    
   deploy:
        name: Deploy to Docker Hub
        needs: [code, build, test]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
            
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and push production image
              uses: docker/build-push-action@v6
              with:
                context: ./server
                file: ./server/Dockerfile # Validated root execution path
                push: true
                tags: |
                    ${{ vars.DOCKERHUB_USERNAME }}/streamflix-api:latest
                    ${{ vars.DOCKERHUB_USERNAME }}/streamflix-api:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max    